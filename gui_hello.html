<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hello Bend!</title>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: monospace; color: #e0e0e0; }
    canvas { border: 2px solid #444; cursor: crosshair; }
    h1 { margin-bottom: 12px; color: #ff6b6b; }
    p { margin-top: 8px; color: #888; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Hello Bend!</h1>
  <canvas id="c" width="512" height="512"></canvas>
  <p>Click to change colors | Escape to reset</p>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const W = 512, H = 512;
    let offset = 0;

    function color(r, g, b) {
      return `rgb(${r},${g},${b})`;
    }

    function drawGradient() {
      const img = ctx.createImageData(W, H);
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const r = Math.min(((x + offset) * 256 / 512) | 0, 255);
          const g = Math.min(((y + offset) * 256 / 512) | 0, 255);
          const b = Math.min(((x + y + offset) * 128 / 512) | 0, 255);
          const i = (y * W + x) * 4;
          img.data[i]     = r;
          img.data[i + 1] = g;
          img.data[i + 2] = b;
          img.data[i + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);

      ctx.fillStyle = "white";
      ctx.font = "bold 24px monospace";
      ctx.textAlign = "center";
      ctx.fillText("Hello Bend!", W / 2, 40);

      ctx.font = "16px monospace";
      ctx.fillStyle = "#aaa";
      ctx.fillText(`offset: ${offset}`, W / 2, H - 20);
    }

    canvas.addEventListener("click", (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      offset = (x + y) | 0;
      drawGradient();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        offset = 0;
        drawGradient();
      }
    });

    drawGradient();
  </script>
</body>
</html>
